# Client-approved answers to common hesitations. FICTIONAL demo content.
objections:
  - objection: "It's too expensive."
    answer: "That's fair to weigh. Many guests start with a HydraFacial or dermaplaning, which are lower-cost ways to see results, and build from there."
  - objection: "I'm worried it will hurt."
    answer: "Most of our treatments are very comfortable. For anything with needles, we use numbing, and your provider checks in the whole time."
  - objection: "I don't want to look fake."
    answer: "Our injectors are known for natural results. Your consultation is where you set the look you want, and subtle is always an option."
  - objection: "I can't have downtime."
    answer: "Plenty of options have none, like HydraFacial, dermaplaning, and laser hair removal. I can point you to those."
