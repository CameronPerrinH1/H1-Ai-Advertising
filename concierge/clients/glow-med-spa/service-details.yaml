dermaplaning:
  summary:
    en: "Gentle exfoliation that removes dead skin and peach fuzz for an instantly smooth finish."
    es: "Exfoliación suave que elimina células muertas y vello fino para un acabado suave al instante."
  what_to_expect: "A sterile blade glides over the skin. No pain, about 30 minutes."
  downtime: { en: "None", es: "Ninguno" }
  results: { en: "Smoother skin right away; makeup goes on better", es: "Piel más suave al instante; el maquillaje se aplica mejor" }
  prep: "Avoid sunburn and retinoids for 3 days before."
  aftercare: "Wear sunscreen; skip exfoliants for 3 days."
  good_for: [texture, peach fuzz, pre-event glow, dull skin]
  requires_assessment: false
  image: /media/glow-med-spa/facial.svg
  timing: { min_days_before_event: 2, ideal_days_before_event: 3 }
  care:
    before:
      en: ["Avoid sunburn and retinoids for 3 days", "Tell us about any active breakouts"]
      es: ["Evita quemaduras de sol y retinoides por 3 días", "Avísanos si tienes brotes activos"]
    day_of:
      en: ["Skin may look a little pink for an hour or two"]
      es: ["La piel puede verse un poco rosada por una o dos horas"]
    after:
      en: ["Wear sunscreen", "Skip exfoliants for 3 days", "Makeup is fine the next day"]
      es: ["Usa protector solar", "No uses exfoliantes por 3 días", "Puedes maquillarte al día siguiente"]

chemical-peel:
  summary:
    en: "A medium-depth peel that evens tone and smooths texture as old skin sheds."
    es: "Un peeling de profundidad media que unifica el tono y suaviza la textura al renovarse la piel."
  what_to_expect: "A solution is applied in layers. Some warmth or tingling for a few minutes."
  downtime: { en: "3 to 5 days of peeling", es: "De 3 a 5 días de descamación" }
  results: { en: "Brighter, more even skin in about a week", es: "Piel más luminosa y uniforme en una semana aproximadamente" }
  prep: "Stop retinoids 5 days before; no waxing on the face for a week."
  aftercare: "Don't pick peeling skin; gentle cleanser, moisturizer, and sunscreen."
  good_for: [uneven tone, sun spots, texture, mild acne marks]
  requires_assessment: false
  image: /media/glow-med-spa/peel.svg
  timing: { min_days_before_event: 10, ideal_days_before_event: 21 }
  care:
    before:
      en: ["Stop retinoids 5 days before", "No facial waxing for a week", "Avoid sunburn"]
      es: ["Suspende los retinoides 5 días antes", "Nada de cera en el rostro durante una semana", "Evita quemaduras de sol"]
    day_of:
      en: ["Expect warmth or tingling for a few minutes", "Skip makeup for the rest of the day"]
      es: ["Puedes sentir calor u hormigueo por unos minutos", "No te maquilles el resto del día"]
    after:
      en: ["Peeling usually starts on day 2 or 3", "Don't pick or peel skin", "Gentle cleanser, moisturizer, and sunscreen daily"]
      es: ["La descamación suele empezar el día 2 o 3", "No arranques la piel", "Limpiador suave, hidratante y protector solar a diario"]

microneedling:
  summary:
    en: "Tiny channels in the skin boost collagen to soften fine lines, scars, and pores over a series."
    es: "Microcanales en la piel estimulan el colágeno para suavizar líneas finas, cicatrices y poros con varias sesiones."
  what_to_expect: "Numbing cream first, then about 30 minutes of treatment. Usually a series of 3."
  downtime: { en: "1 to 3 days of redness", es: "De 1 a 3 días de enrojecimiento" }
  results: { en: "Gradual improvement over 4 to 6 weeks", es: "Mejora gradual en 4 a 6 semanas" }
  prep: "Stop retinoids 3 days before."
  aftercare: "No makeup for 24 hours; gentle skincare and sunscreen."
  good_for: [fine lines, acne scars, texture, large pores]
  requires_assessment: false
  image: /media/glow-med-spa/renewal.svg
  timing: { min_days_before_event: 7, ideal_days_before_event: 28 }
  care:
    before:
      en: ["Stop retinoids 3 days before", "Avoid sunburn", "Arrive with clean skin"]
      es: ["Suspende los retinoides 3 días antes", "Evita quemaduras de sol", "Llega con la piel limpia"]
    day_of:
      en: ["Skin will look pink, like a mild sunburn"]
      es: ["La piel se verá rosada, como una quemadura de sol leve"]
    after:
      en: ["No makeup for 24 hours", "Skip workouts for 24 hours", "Gentle skincare and sunscreen"]
      es: ["No te maquilles durante 24 horas", "Evita el ejercicio durante 24 horas", "Cuidado suave y protector solar"]

ipl-photofacial:
  summary:
    en: "Light-based treatment that fades sun spots and redness for clearer, more even skin."
    es: "Tratamiento con luz que atenúa manchas solares y enrojecimiento para una piel más clara y uniforme."
  what_to_expect: "Quick pulses of light with a snapping feeling. About 30 minutes."
  downtime: { en: "Spots darken, then flake off in 5 to 7 days", es: "Las manchas se oscurecen y se desprenden en 5 a 7 días" }
  results: { en: "Clearer skin in 1 to 2 weeks; best in a series", es: "Piel más clara en 1 a 2 semanas; mejor en varias sesiones" }
  prep: "No sun exposure or self-tanner for 2 weeks before."
  aftercare: "Strict sunscreen; avoid sun for 2 weeks."
  good_for: [sun spots, redness, uneven tone]
  requires_assessment: false
  image: /media/glow-med-spa/laser.svg
  timing: { min_days_before_event: 14, ideal_days_before_event: 21 }
  care:
    before:
      en: ["No sun or self-tanner for 2 weeks", "Tell us about any recent tan"]
      es: ["Nada de sol ni autobronceador por 2 semanas", "Avísanos si te bronceaste hace poco"]
    day_of:
      en: ["Mild redness for a few hours"]
      es: ["Enrojecimiento leve por unas horas"]
    after:
      en: ["Spots darken, then flake off in 5 to 7 days", "Strict sunscreen for 2 weeks"]
      es: ["Las manchas se oscurecen y se desprenden en 5 a 7 días", "Protector solar estricto por 2 semanas"]

laser-hair-removal:
  summary:
    en: "Long-lasting hair reduction on almost any area, priced by area."
