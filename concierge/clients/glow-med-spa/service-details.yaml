  what_to_expect: "A quick snap with cooling. Small areas take about 10 minutes. A series of 6 to 8 sessions."
  downtime: { en: "None to mild redness for a few hours", es: "Ninguno o leve enrojecimiento por unas horas" }
  results: { en: "Noticeable reduction after 3 to 4 sessions", es: "Reducción visible después de 3 a 4 sesiones" }
  prep: "Shave the area the day before; no tanning for 2 weeks."
  aftercare: "Avoid sun and hot workouts for 24 hours."
  good_for: [unwanted hair, ingrown hairs, razor bumps]
  requires_assessment: false
  image: /media/glow-med-spa/laser.svg
