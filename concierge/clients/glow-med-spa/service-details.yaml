# Treatment details, keyed by service ID. FICTIONAL demo content; not medically reviewed.
# In a real client this file needs medical director approval before launch (D38), including
# the event timing (countdown planner) and the care guides.
hydrafacial:
  summary:
    en: "A deep-cleansing, hydrating facial that leaves skin smooth and glowing the same day."
    es: "Un facial de limpieza profunda e hidratación que deja la piel suave y luminosa el mismo día."
  what_to_expect: "Cleansing, gentle exfoliation, painless extractions, then a hydrating serum infusion. Most guests find it relaxing."
  downtime: { en: "None", es: "Ninguno" }
  results: { en: "Glow right away; lasts about a week", es: "Luminosidad inmediata; dura cerca de una semana" }
  prep: "Skip retinoids and exfoliants for 2 days before."
  aftercare: "Avoid heavy makeup for the rest of the day; wear sunscreen."
  good_for: [dull skin, congestion, dehydration, pre-event glow, sensitive skin]
  requires_assessment: false
  image: /media/glow-med-spa/facial.svg
  timing: { min_days_before_event: 1, ideal_days_before_event: 3 }
  care:
    before:
      en: ["Skip retinoids and exfoliants for 2 days", "Come with clean skin if you can"]
      es: ["Evita retinoides y exfoliantes por 2 días", "Si puedes, ven con la piel limpia"]
    day_of:
      en: ["No downtime; go right back to your day"]
      es: ["Sin recuperación; vuelve a tu día de inmediato"]
    after:
      en: ["Skip heavy makeup for the rest of the day", "Wear sunscreen", "Hold off on exfoliants for 48 hours"]
      es: ["Evita el maquillaje pesado el resto del día", "Usa protector solar", "No uses exfoliantes por 48 horas"]

