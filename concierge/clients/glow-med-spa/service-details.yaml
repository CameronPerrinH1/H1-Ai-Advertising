  downtime: { en: "1 to 3 days of swelling", es: "De 1 a 3 días de inflamación" }
  results: { en: "Visible right away; settles in 2 weeks; lasts 6 to 12 months", es: "Visible al instante; se asienta en 2 semanas; dura de 6 a 12 meses" }
