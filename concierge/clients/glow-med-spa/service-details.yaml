  downtime: { en: "None; avoid lying down for 4 hours", es: "Ninguno; evita acostarte durante 4 horas" }
  results: { en: "Results in 5 to 7 days; lasts 3 to 4 months", es: "Resultados en 5 a 7 días; dura de 3 a 4 meses" }
  prep: "Your injector reviews your health history at the consultation."
  aftercare: "No rubbing the area or strenuous exercise for 24 hours."
  good_for: [fine lines, forehead lines, frown lines, crow's feet]
  requires_assessment: true
  image: /media/glow-med-spa/injectables.svg
  timing: { min_days_before_event: 14, ideal_days_before_event: 21 }
  care:
    before:
      en: ["Your injector reviews your health history at the consultation", "Skip alcohol the day before to reduce bruising"]
      es: ["Tu inyectora revisa tu historial de salud en la consulta", "Evita el alcohol el día anterior para reducir moretones"]
    day_of:
      en: ["Don't lie down for 4 hours", "Don't rub or massage the area"]
      es: ["No te acuestes durante 4 horas", "No frotes ni masajees la zona"]
    after:
      en: ["Skip strenuous exercise for 24 hours", "Results show in 5 to 7 days", "Full results at about 2 weeks"]
      es: ["Evita el ejercicio intenso por 24 horas", "Los resultados se ven en 5 a 7 días", "Resultado completo a las 2 semanas aproximadamente"]

