    after:
      en: ["Avoid sun and hot workouts for 24 hours", "Shaving between sessions is fine"]
      es: ["Evita el sol y el ejercicio intenso por 24 horas", "Puedes rasurarte entre sesiones"]

botox:
  summary:
    en: "Softens expression lines like forehead lines, frown lines, and crow's feet."
    es: "Suaviza las líneas de expresión de la frente, el entrecejo y las patas de gallo."
