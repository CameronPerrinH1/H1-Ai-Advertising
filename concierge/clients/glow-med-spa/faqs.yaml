# Front-desk questions with approved answers. FICTIONAL demo content.
faqs:
  - q: "Where are you, and is there parking?"
    a: "We're at 123 Main St in Anytown, with free parking behind the building."
  - q: "What are your hours?"
    a: "Tuesday through Friday 9 to 6 (Thursday until 7), and Saturday 9 to 4. We're closed Sunday and Monday."
  - q: "What should I expect at my first visit?"
    a: "Arrive 10 minutes early to fill out a short form. Your provider will talk through your goals before any treatment."
  - q: "Do you offer financing?"
    a: "Not at this time. We accept all major credit cards, HSA/FSA cards where eligible, and Glow gift cards."
  - q: "Do you sell gift cards?"
    a: "Yes, in any amount, at the front desk or by phone."
  - q: "Is there an age minimum?"
    a: "Yes, guests must be 18 or older for all treatments."
  - q: "Can I bring a friend or book for a group?"
    a: "Yes. For two or more people at once, or bridal parties, the team will set it up for you; I can have them call you."
  - q: "How do I cancel or reschedule?"
    a: "Use the manage-appointments link to change your booking, or call us. We ask for 24 hours notice, or a $50 fee applies."
  - q: "Can I come in if I'm pregnant or breastfeeding?"
    a: "Some treatments aren't offered during pregnancy or breastfeeding. Your provider will go over what's right for you at a consultation."
