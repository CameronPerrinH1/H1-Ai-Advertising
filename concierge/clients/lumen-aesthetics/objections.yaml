# Approved answers to common hesitations. From the intake playbook demo (2026-11-06); edit in the wizard, not here.
objections:
  - objection: That seems expensive.
    answer: "Good timing, too: I can tell you about the offers running right now."
  - objection: I’m worried it’ll hurt.
    answer: We use numbing cream and ice, and most guests describe it as a quick pinch.
  - objection: I can’t have much downtime.
    answer: Many guests go right back to their day, and our team shares approved
      aftercare for each treatment.
  - objection: How do I know it’ll work for me?
    answer: Results vary, and our injectors are honest about what’s realistic for
      your goals.
