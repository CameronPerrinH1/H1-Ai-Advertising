# Front-desk questions with approved answers, from Plumb + Pine's Jotform (2026-10-29) and website.
# Jen must review before launch.
faqs:
  - q: "Where are you, and is there parking?"
    a: "We're at 538 W Plumb Ln, Suite B, in Reno, in the Plumgate Shopping Center near Starbucks and across the parking lot from Butcher Boy. Parking is easy."
  - q: "What are your hours?"
    a: "We're by appointment only, and days and times vary. You can book online through Vagaro, or I can have Jen reach out to find a time."
  - q: "Is there a front desk?"
    a: "There's no front desk. Jen will let you in when you arrive for your appointment."
  - q: "What should I know before my first visit?"
    a: "Bring a list of your current prescriptions and the skincare products you use at home. Please don't have Botox or filler within 14 days before a facial."
  - q: "What's your cancellation policy?"
    a: "Cancel at least 24 hours ahead and there's no charge. Same-day cancellations and no-shows are charged 100% of the service to the card on file."
  - q: "What if I'm running late?"
    a: "Please let Jen know if you're running late. If you arrive more than 15 minutes after your appointment time, the service may need to be rescheduled."
  - q: "Do you offer refunds?"
    a: "There are no refunds on services or products. Unopened products can be returned within 10 days of purchase."
  - q: "What payment methods do you take?"
    a: "Cash, credit and debit cards, HSA and FSA cards, and Apple Pay or Google Pay."
  - q: "Do you offer financing?"
    a: "Not at this time."
  - q: "Do you need a deposit to book?"
    a: "No deposit is needed. We do ask for 24 hours notice to book."
  - q: "How far ahead can I book?"
    a: "Up to 6 months ahead."
  - q: "Is there an age minimum?"
    a: "Guests need to be 16 or older. Guests under 18 can be seen with a parent or guardian present."
  - q: "Do you sell gift cards or memberships?"
    a: "Not right now."
  - q: "Where can I buy products?"
    a: "Products are sold in the studio."
