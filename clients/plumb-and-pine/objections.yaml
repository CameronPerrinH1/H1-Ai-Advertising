# Approved answers to common hesitations. From the intake playbook 6ab580b0b67d (2026-11-09); edit in the wizard, not here.
objections:
  - objection: That seems expensive.
    answer: Every plan is different, so a complimentary consult is the best way to
      get an exact quote with no pressure.
  - objection: I’m worried it’ll hurt.
    answer: That’s one of the most common worries we hear, and you’re in good hands.
      Our injectors go at your pace.
  - objection: I can’t have much downtime.
    answer: Your injector can walk you through what to expect for your plan at a
      consult.
  - objection: How do I know it’ll work for me?
    answer: A consult is the best way to talk through your goals and what’s
      realistic for you.
