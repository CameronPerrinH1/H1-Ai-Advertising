# Approved answers to common hesitations. From the intake playbook a34bced50e6f (2026-11-19); edit in the wizard, not here.
objections:
  - objection: That seems expensive.
    answer: That’s fair, and it’s a real investment. Our estheticians have advanced
      training, and we focus on results that look natural.
  - objection: I can’t have much downtime.
    answer: Many clients go right back to their day, and our team shares approved
      aftercare for each treatment.
  - objection: How do I know it’ll work for me?
    answer: Results vary, and our estheticians are honest about what’s realistic for
      your goals.
