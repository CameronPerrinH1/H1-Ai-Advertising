  # gold (#AE7F54, logo lettering) for buttons and the guest's bubbles, cream (#F7F6F3) for soft
  # surfaces. Her site uses Neutra Text (commercial); the chat uses Avenir, its closest system
  # font, until her license is confirmed to cover chat.plumbandpine.com (D53: no hosted fonts).
  colors: { primary: "#AE7F54", secondary: "#F7F6F3", accent: "#032E5B" }
  fonts:
    heading: "'Neutra Text', 'Avenir Next', Avenir, 'Century Gothic', -apple-system, 'Segoe UI', sans-serif"
    body: "'Avenir Next', Avenir, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    license: "System fonts only (Avenir where available); Neutra Text needs Jen's web license to cover the chat domain (D53)"

display:
  modes: [ askbar, fullscreen, inline ]
  nudge_delay_seconds: 20
  # The ask bar on each page of plumbandpine.com: its greeting, box hint and "Asking about" topic.
  # Paths are exact, or a prefix ending in "*". {name} is the coordinator's name.
  pages:
    "/":
      greeting: "Hi, I'm {name}. Tell me what you'd like to change about your skin or scalp, and I'll point you to the right treatment."
      placeholder: "Ask about facials, scalp care, pricing…"
    "/jen-home":
      greeting: "Hi, I'm {name}. Tell me what you'd like to change about your skin or scalp, and I'll point you to the right treatment."
      placeholder: "Ask about facials, scalp care, pricing…"
    "/home-chat": # unlisted preview page on her live site (Nov 10), pointed at the staging stack
      greeting: "Hi, I'm {name}. Tell me what you'd like to change about your skin or scalp, and I'll point you to the right treatment."
      placeholder: "Ask about facials, scalp care, pricing…"
    "/services*":
      greeting: "Have a question about a treatment? I can explain what it does, what it costs, and how to book."
      placeholder: "Ask about a treatment…"
      topic: "treatments"
    "/treatments/hydrafacial-treatments":
      topic: "HydraFacial"
      placeholder: "Ask about HydraFacial…"
    "/treatments/microchanneling-treatments":
      topic: "Microchanneling"
      placeholder: "Ask about microchanneling…"
    "/treatments/glo2facial":
      topic: "the Glo2 Facial"
      placeholder: "Ask about the Glo2 Facial…"
    "/treatments/hair-rejuvenation":
      topic: "scalp and hair"
      placeholder: "Ask about scalp treatments…"
    "/treatments/danne-montague-king":
      topic: "DMK"
      placeholder: "Ask about DMK treatments…"
    "/treatments*":
      greeting: "Have a question about this treatment? I can explain what it does, what it costs, and how to book."
      placeholder: "Ask about this treatment…"
      topic: "treatments"
    "/about*":
      greeting: "Curious about Jen? Ask about her training, her approach, or what to expect at your visit."
      placeholder: "Ask about Jen, her training, her approach…"
      topic: "Jen"
  suggested_questions:
    default:
      en:
        - What's right for my skin?
        - What helps with thinning hair?
        - What should I know before my first visit?
    pages:
      "/services*":
        en: [ "Which facial is right for me?", "What's the difference between the HydraFacials?", "What's the most affordable option?" ]
      "/treatments*":
        en: [ "Is this right for my skin?", "How much does it cost?", "Can I book online?" ]
      "/about*":
        en: [ "Who is Jen?", "What does Jen specialize in?", "What should I know before my first visit?" ]

