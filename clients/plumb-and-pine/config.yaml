  email_provider_baa_confirmed: false
  callback_response_time: { en: "within 2 business days" }
  categories: [ reschedule, cancel, complaint, other ]
  extra_handoff_topics: [ "group bookings" ]
  wording:
    cant_answer: I’d rather get you the right answer than guess. Can I have our team
      follow up with you?
    medical: I’m not able to give medical advice, but our injectors can answer that
      at a consult or by phone. Would you like them to reach out within
      {response_time}?
    not_offered: We don’t offer that here, but I’d love to connect you with our team
      to find the best fit for your goals. Would you like them to follow up?
    consult_required: We always begin with a consult for this one, so your injector
      can make sure it’s the right fit. Would you like me to help you schedule a
      visit?
    callback: Happy to set that up. Our team will call you back within {response_time}.
    complaint: Thank you for telling us. This deserves a real person’s attention, so
      I’m sharing it with our team now. Expect to hear back within
      {response_time}.

